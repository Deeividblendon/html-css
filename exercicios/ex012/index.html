<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeos com HTML5</title>
</head>
<body>
  <h1>Inserindo Vídeos Hospedados Localmente</h1>
  <p>Este vídeo está hospedado no meu próprio servidor.</p>

  <video width="560px" poster="imagens/imagem-capa.jpg" controls loop>
    <source src="midia/meu-video.mp4" type="video/mp4">
    <source src="midia/meu-video.m4v" type="mp4">
    <source src="midia/meu-video.webm" type="webm">
    <source src="midia/meu-video.ogv" type="ogg">
    <p>Seu navegador não tem compatibilidade com reprodução de vídeo.</p>
  </video>

  <h1>Inserindo Vídeos do Vimeo</h1>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=MDQhGqT6E5EX-0Ae" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <h1>Inserindo Vídeos do Vimeo</h1>
  <div style="position:relative; width:100%; max-width:560px; aspect-ratio: 16/9;">
      <iframe src="https://player.vimeo.com/video/137613889?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" 
              frameborder="0" 
              allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
              referrerpolicy="strict-origin-when-cross-origin" 
              style="position:absolute; top:0; left:0; width:100%; height:100%;" 
              title="6LD - Commissioned Commercial">
      </iframe>
  </div>
  <script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
